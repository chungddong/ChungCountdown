<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="새해 카운트다운 - 2026년을 향한 시간">
    <title>새해 카운트다운 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="background-animation">
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
        </div>
        
        <header>
            <h1 class="title">새해 카운트다운</h1>
            <p class="subtitle">2026년까지 남은 시간</p>
        </header>

        <main>
            <div class="countdown-container">
                <div class="countdown-item">
                    <div class="countdown-value" id="days">0</div>
                    <div class="countdown-label">일</div>
                </div>
                <div class="countdown-separator">:</div>
                <div class="countdown-item">
                    <div class="countdown-value" id="hours">0</div>
                    <div class="countdown-label">시간</div>
                </div>
                <div class="countdown-separator">:</div>
                <div class="countdown-item">
                    <div class="countdown-value" id="minutes">0</div>
                    <div class="countdown-label">분</div>
                </div>
                <div class="countdown-separator">:</div>
                <div class="countdown-item">
                    <div class="countdown-value" id="seconds">0</div>
                    <div class="countdown-label">초</div>
                </div>
            </div>

            <div class="message" id="message">
                <p>2026년을 기대하며...</p>
            </div>
        </main>

        <footer>
            <p>🎊 새해 복 많이 받으세요! 🎊</p>
        </footer>
    </div>

    <button class="test-button" id="testButton">🎉 새해 테스트</button>
    <button class="test-button jan1-button" id="testJan1Button">📅 1월 1일 테스트</button>
    
    <script src="script.js"></script>
</body>
</html>
